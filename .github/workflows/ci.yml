name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_OFFLINE: "1"
      TYPESAFE_API_KEY: ""
      JEV_API_KEY: ""
      TYPESAFE_KEY_FILE: /tmp/jev-ci-missing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: make lint
      - run: make secret-scan
      - run: make test
      - run: make examples

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TYPESAFE_API_KEY: ""
          JEV_API_KEY: ""
          TYPESAFE_KEY_FILE: /tmp/jev-ci-missing-key
